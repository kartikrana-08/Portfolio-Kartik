
<style>
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    padding: 2rem 1rem 1.5rem;
    gap: 1.2rem;
  }
  .ctrl-row {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .ctrl-row button { font-size: 13px; padding: 6px 18px; cursor: pointer; }
  .ctrl-row label { font-size: 13px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; }
</style>

<div class="wrap">
  <canvas id="c" width="620" height="290"></canvas>
  <div class="ctrl-row">
    <button onclick="restart()">Replay ↺</button>
    <label>Speed <input type="range" min="1" max="5" value="2" step="1" id="spd" style="width:80px"> <span id="spdV">2</span></label>
    <label>Density <input type="range" min="1" max="5" value="3" step="1" id="den" style="width:80px"> <span id="denV">3</span></label>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CLR = '#C8513A';

  const spdEl = document.getElementById('spd');
  const denEl = document.getElementById('den');
  spdEl.oninput = () => document.getElementById('spdV').textContent = spdEl.value;
  denEl.oninput = () => document.getElementById('denV').textContent = denEl.value;

  const FONT = 'bold 88px sans-serif';
  const WORD_CX = W * 0.38;
  const WORD_Y  = H * 0.64;
  const GROUND_Y = H - 20;
  const PS = 3; // pixel size

  // landing zone — close to the word, right side
  const LAND_CX   = W * 0.76;
  const LAND_HALF = 38;

  // mountain: col (in pixel units) -> stack count
  const mtn = {};

  function getWordPixels() {
    const oc = document.createElement('canvas');
    oc.width = W; oc.height = H;
    const ox = oc.getContext('2d');
    ox.fillStyle = '#000';
    ox.font = FONT;
    ox.textAlign = 'center';
    ox.textBaseline = 'middle';
    ox.fillText('pixel', WORD_CX, WORD_Y);
    const d = ox.getImageData(0,0,W,H).data;
    const pts = [];
    for (let y=0;y<H;y+=3) for (let x=0;x<W;x+=3)
      if (d[(y*W+x)*4+3]>128) pts.push({x,y});
    return pts;
  }
  const SRC = getWordPixels();

  let particles = [];
  let animId, frame = 0;

  function restart() {
    cancelAnimationFrame(animId);
    particles = [];
    for (const k in mtn) delete mtn[k];
    frame = 0;
    ctx.clearRect(0,0,W,H);
    loop();
  }
  window.restart = restart;

  function spawnParticle(src) {
    const speed = parseInt(spdEl.value);
    const g = 0.10 + speed * 0.035;
    // land randomly within zone — irregular spread
    const landX = LAND_CX + (Math.random()-0.5) * LAND_HALF * 2 + (Math.random()-0.5)*10;
    const T = 80 - speed * 8 + Math.random() * 24;
    const vx = (landX - src.x) / T;
    const vy = (GROUND_Y - src.y - 0.5 * g * T * T) / T;
    return {
      x: src.x, y: src.y,
      vx, vy, g,
      size: Math.random() < 0.45 ? 2 : Math.random() < 0.8 ? 3 : 4,
      landX, phase: 'arc'
    };
  }

  function colFor(x) { return Math.round(x / PS); }

  function settlePixel(landX) {
    // add random jitter so mountain is bumpy/irregular
    const jitter = Math.floor((Math.random()-0.5) * 5);
    const col = colFor(landX) + jitter;
    if (!mtn[col]) mtn[col] = 0;
    // cap height but with random variation per col for irregularity
    const maxH = 18 + Math.floor(Math.random()*6);
    if (mtn[col] < maxH) mtn[col]++;
  }

  function drawWord() {
    ctx.save();
    ctx.font = FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = CLR;
    ctx.globalAlpha = 1;
    ctx.fillText('pixel', WORD_CX, WORD_Y);
    ctx.restore();
  }

  function drawMountain() {
    ctx.fillStyle = CLR;
    for (const col in mtn) {
      const stackH = mtn[col];
      const px = col * PS;
      for (let row = 0; row < stackH; row++) {
        // tiny alpha noise per pixel for texture — not uniform
        ctx.globalAlpha = 0.78 + Math.sin(row * 1.3 + col * 0.7) * 0.15;
        ctx.fillRect(px, GROUND_Y - row * PS, PS - 0.5, PS - 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop() {
    const speed = parseInt(spdEl.value);
    const density = parseInt(denEl.value);
    ctx.clearRect(0,0,W,H);
    drawWord();
    frame++;

    const rate = Math.max(2, 6 - density);
    if (frame % rate === 0 && SRC.length) {
      const count = Math.ceil(density * 0.9);
      for (let k=0; k<count; k++) {
        const src = SRC[Math.floor(Math.random()*SRC.length)];
        particles.push(spawnParticle(src));
      }
    }

    ctx.fillStyle = CLR;
    for (let i = particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.vy += p.g;
      p.x  += p.vx;
      p.y  += p.vy;
      if (p.y >= GROUND_Y) {
        settlePixel(p.landX);
        particles.splice(i,1);
        continue;
      }
      ctx.globalAlpha = 0.88;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }

    drawMountain();
    ctx.globalAlpha = 1;
    animId = requestAnimationFrame(loop);
  }

  loop();
})();
</script>
